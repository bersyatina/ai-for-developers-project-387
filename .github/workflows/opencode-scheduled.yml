name: opencode-scheduled

# Ночная проверка: Lighthouse CLI по расписанию (утро по Екатеринбургу ~11:30).
# Тот же запуск доступен вручную из вкладки Actions (workflow_dispatch).

on:
  schedule:
    - cron: "30 5 * * *" # каждый день в 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Запуск Lighthouse CLI
        run: |
          mkdir -p ./lighthouse
          npx --yes lighthouse https://call-calendar-production.up.railway.app \
            --chrome-flags="--headless --no-sandbox --disable-gpu --no-zygote" \
            --output json --output html --output-path ./lighthouse/report

      - name: Краткая сводка баллов
        run: |
          jq -r '
            "URL: " + (.finalUrl // "n/a"),
            "Performance: " + (.categories.performance.score * 100 | floor | tostring),
            "Accessibility: " + (.categories.accessibility.score * 100 | floor | tostring),
            "Best Practices: " + (.categories["best-practices"].score * 100 | floor | tostring),
            "SEO: " + (.categories.seo.score * 100 | floor | tostring)
          ' ./lighthouse/report.report.json > ./lighthouse/summary.txt
          cat ./lighthouse/summary.txt

      - name: Загрузка отчёта (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: ./lighthouse/
          retention-days: 14

      - name: Публикация сводки (issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%F)
          TITLE="Lighthouse: $DATE"
          BODY="Ночная проверка Lighthouse по https://call-calendar-production.up.railway.app

          $(cat ./lighthouse/summary.txt)

          Полный отчёт (artifact): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "
          EXISTING=$(gh issue list --search "Lighthouse:" --state open --json number --limit 1 | jq -r '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Обновлён issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
