name: opencode

# OpenCode GitHub-агент: вызывается из комментариев к issue/PR.
# Триггер — только команды /oc или /opencode в комментарии реального пользователя.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Минимальные права: OIDC-токен для обмена на токен OpenCode GitHub App.
permissions:
  id-token: write

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
      && github.event.comment.user.type == 'User'
      && github.actor != 'opencode[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: deepseek/deepseek-v4-flash
